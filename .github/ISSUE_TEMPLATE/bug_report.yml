name: Bug report
description: Something looks wrong, does not show up or slows the page down
labels: [bug]
body:
  - type: dropdown
    id: season
    attributes:
      label: Season
      options: [winter, spring, summer, autumn, auto]
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How is it added?
      options: [React component, Vanilla createSeasonalEffect, Script tag (auto.js), createScene]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Framework, browser and OS
      placeholder: Next.js 16, Safari 19, iOS 26
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens and what did you expect?
      description: A screenshot or screen recording helps a lot.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      render: tsx
  - type: checkboxes
    id: motion
    attributes:
      label: Checks
      options:
        - label: Reduced motion is off in my OS (the effect is hidden when it is on)
          required: true
